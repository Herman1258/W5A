<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W5A Assignment - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Standard Nested Mobile Header Module -->
    <header class="top-bar">

    <!-- Main Mobile Page Content Wrapper Block -->

            <p>Welcome to my home page built using responsive SASS components! Check out my <a href="pages/aboutme.html">About Me Page</a>.</p>
        </div>

    <!-- Standard Nested Mobile Footer Module -->
    <footer class="site-footer">
        <p>Copyright 2026 - Terms of Service</p>
    </footer>

</body>
</html>
